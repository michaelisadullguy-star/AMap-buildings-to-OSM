name: Probe Amap endpoints

on:
  workflow_dispatch:
  push:
    paths:
      - "probe_tiles.py"
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests mercantile
      - name: Run probe
        env:
          AMAP_JSKEY: ${{ secrets.AMAP_JSKEY }}
          AMAP_JSCODE: ${{ secrets.AMAP_JSCODE }}
          AMAP_SECRET: ${{ secrets.AMAP_SECRET }}
        run: python probe_tiles.py
      - name: Upload raw captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe_out/
          if-no-files-found: warn
