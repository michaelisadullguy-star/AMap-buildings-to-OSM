name: Microsoft buildings → OSM test

on:
  workflow_dispatch:
  push:
    paths:
      - "buildings2osm.py"
      - "prep_scope.py"
      - ".github/workflows/buildings-test.yml"
      - "test_input/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build merged test scope (outer ∖ inner)
        run: |
          python prep_scope.py \
            test_input/outer.geojson \
            test_input/inner.osm \
            test_input/scope.geojson

      - name: Extract Microsoft footprints and export OSM
        run: |
          python buildings2osm.py \
            --boundary test_input/scope.geojson \
            --out out/ \
            --osm-format both \
            --verbose

      - name: Output summary
        if: always()
        run: |
          ls -la out/ || true
          if [ -f out/buildings.osm ]; then
            echo "Way count:  $(grep -c '<way ' out/buildings.osm)"
            echo "Node count: $(grep -c '<node ' out/buildings.osm)"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildings
          path: |
            test_input/scope.geojson
            out/
          if-no-files-found: warn
